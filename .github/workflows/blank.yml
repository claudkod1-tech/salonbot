name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SalonMailer.xcodeproj -scheme SalonMailer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SalonMailer.app Payload/
          zip -r SalonMailer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Рассылка
          path: SalonMailer.ipa
